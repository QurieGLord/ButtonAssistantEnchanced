<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#1c2245"/>
      <stop offset="60%" stop-color="#0e1228"/>
      <stop offset="100%" stop-color="#060810"/>
    </radialGradient>
    <radialGradient id="ringHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a9ff5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5a9ff5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arcTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a88e8"/>
      <stop offset="100%" stop-color="#a8d0ff"/>
    </linearGradient>
    <linearGradient id="arcBot" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4a88e8"/>
      <stop offset="100%" stop-color="#7ab0f0"/>
    </linearGradient>
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#90b8f0"/>
    </linearGradient>
    <linearGradient id="fogB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3060" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a2850" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="fogT" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141830" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#141830" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="icon">
      <rect x="0" y="0" width="1024" height="1024" rx="205"/>
    </clipPath>
  </defs>

  <g clip-path="url(#icon)">

    <!-- Base night -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

    <!-- Central ambient halo -->
    <circle cx="512" cy="488" r="470" fill="url(#ringHalo)"/>

    <!-- Stars -->
    <circle cx="120" cy="105" r="2.5" fill="#cce0ff" opacity="0.7"/>
    <circle cx="195" cy="68"  r="1.8" fill="#ffffff" opacity="0.5"/>
    <circle cx="300" cy="85"  r="1.5" fill="#ddeeff" opacity="0.45"/>
    <circle cx="460" cy="52"  r="2"   fill="#cce0ff" opacity="0.6"/>
    <circle cx="615" cy="72"  r="1.5" fill="#ffffff" opacity="0.5"/>
    <circle cx="740" cy="58"  r="2.2" fill="#ddeeff" opacity="0.55"/>
    <circle cx="860" cy="90"  r="1.5" fill="#cce0ff" opacity="0.4"/>
    <circle cx="940" cy="140" r="2"   fill="#ffffff" opacity="0.45"/>
    <circle cx="82"  cy="255" r="1.5" fill="#ddeeff" opacity="0.4"/>
    <circle cx="958" cy="282" r="2"   fill="#cce0ff" opacity="0.4"/>
    <circle cx="970" cy="420" r="1.5" fill="#ffffff" opacity="0.35"/>
    <circle cx="58"  cy="468" r="1.8" fill="#ddeeff" opacity="0.38"/>
    <circle cx="234" cy="230" r="1.5" fill="#cce0ff" opacity="0.3"/>
    <circle cx="788" cy="210" r="1.8" fill="#ffffff" opacity="0.35"/>
    <circle cx="525" cy="172" r="1.5" fill="#cce0ff" opacity="0.25"/>
    <!-- Bright accent stars -->
    <circle cx="152" cy="182" r="3.2" fill="#ffffff" opacity="0.6"/>
    <circle cx="844" cy="158" r="2.8" fill="#e8f4ff" opacity="0.55"/>
    <circle cx="368" cy="112" r="2.8" fill="#ffffff" opacity="0.5"/>
    <circle cx="676" cy="142" r="2.5" fill="#cce0ff" opacity="0.55"/>
    <circle cx="905" cy="340" r="2"   fill="#ffffff" opacity="0.38"/>
    <circle cx="72"  cy="370" r="2"   fill="#cce0ff" opacity="0.38"/>

    <!-- === FOG LAYERS === -->
    <!-- Bottom fog bank -->
    <ellipse cx="512" cy="1050" rx="620" ry="300" fill="#1e305a" opacity="0.65"/>
    <ellipse cx="300" cy="940"  rx="420" ry="195" fill="#182848" opacity="0.55"/>
    <ellipse cx="770" cy="960"  rx="360" ry="165" fill="#1e3060" opacity="0.5"/>
    <!-- Mid wisps -->
    <ellipse cx="195" cy="720"  rx="285" ry="90"  fill="#1a2848" opacity="0.28"/>
    <ellipse cx="840" cy="695"  rx="255" ry="82"  fill="#1a2848" opacity="0.25"/>
    <ellipse cx="512" cy="768"  rx="330" ry="76"  fill="#1e2f55" opacity="0.22"/>
    <!-- Top veil -->
    <rect x="0" y="0" width="1024" height="300" fill="url(#fogT)"/>
    <!-- Bottom gradient overlay -->
    <rect x="0" y="720" width="1024" height="304" fill="url(#fogB)"/>

    <!-- === CYCLE RING === -->
    <!-- R=265, centre 512,475 -->
    <!-- Outer soft glow rings -->
    <circle cx="512" cy="475" r="298" fill="none" stroke="#4a88e8" stroke-width="64" opacity="0.07"/>
    <circle cx="512" cy="475" r="298" fill="none" stroke="#6aaaf8" stroke-width="40" opacity="0.09"/>

    <!--
      Two arc halves, R=265.
      Top arc: from ~200° to ~340° (going clockwise, over the top)
        200° => (512 + 265*cos(200°), 475 + 265*sin(200°))
              = (512 - 249.0, 475 - 90.6) = (263, 384)
        340° => (512 + 265*cos(340°), 475 + 265*sin(340°))
              = (512 + 249.0, 475 - 90.6) = (761, 384)

      Bottom arc: from ~20° to ~160° (going clockwise, under the bottom)
        20°  => (512 + 265*cos(20°),  475 + 265*sin(20°))
              = (512 + 249.0, 475 + 90.6) = (761, 566)
        160° => (512 + 265*cos(160°), 475 + 265*sin(160°))
              = (512 - 249.0, 475 + 90.6) = (263, 566)
    -->

    <!-- TOP arc (left to right, over top) -->
    <path d="M 263 384 A 265 265 0 0 1 761 384"
          fill="none" stroke="url(#arcTop)" stroke-width="21" stroke-linecap="round" opacity="0.94"/>

    <!-- TOP arc arrowhead (at right end, pointing right+slightly down) -->
    <!-- tangent at 340° is perpendicular to radius: direction = sin(340°), -cos(340°) = -0.342, -0.940 → normalize → points "forward" along arc -->
    <!-- We'll draw a triangle tip at (761, 384) pointing toward ~(790, 410) -->
    <polygon points="761,384  730,362  742,392" fill="#a8d0ff" opacity="0.96"/>

    <!-- BOTTOM arc (right to left, under bottom) -->
    <path d="M 761 566 A 265 265 0 0 1 263 566"
          fill="none" stroke="url(#arcBot)" stroke-width="21" stroke-linecap="round" opacity="0.94"/>

    <!-- BOTTOM arc arrowhead (at left end, pointing left+slightly up) -->
    <polygon points="263,566  294,588  282,558" fill="#7ab0f0" opacity="0.96"/>

    <!-- Thin inner / outer definition rings -->
    <circle cx="512" cy="475" r="234" fill="none" stroke="#3a5898" stroke-width="2" opacity="0.4"/>
    <circle cx="512" cy="475" r="296" fill="none" stroke="#5a88c8" stroke-width="1.5" opacity="0.32"/>

    <!-- === W LETTERFORM === -->
    <!--
      Centred at 512, spanning ~272px wide, ~196px tall
      Top y=387, Bottom y=583
      Left edge: 376, Right edge: 648
      Five-prong W polygon:
    -->
    <polygon
      points="
        376,390  422,390
        468,534  512,424
        556,534  602,390
        648,390  588,565
        556,472  512,578
        468,472  436,565
      "
      fill="url(#wGrad)"
      opacity="0.97"
    />
    <!-- Top edge highlights -->
    <line x1="376" y1="390" x2="422" y2="390" stroke="#ffffff" stroke-width="3.5" opacity="0.4"/>
    <line x1="602" y1="390" x2="648" y2="390" stroke="#ffffff" stroke-width="3.5" opacity="0.4"/>
    <!-- Subtle W inner glow on centre point -->
    <circle cx="512" cy="424" r="12" fill="#c0d8ff" opacity="0.2"/>

    <!-- === FRAME POLISH === -->
    <rect x="26"  y="26"  width="972" height="972" rx="185"
          fill="none" stroke="#4a70a8" stroke-width="4" opacity="0.28"/>
    <rect x="6"   y="6"   width="1012" height="1012" rx="202"
          fill="none" stroke="#6090c0" stroke-width="2.5" opacity="0.22"/>

  </g>
</svg>
